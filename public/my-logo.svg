<svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Round background -->
  <circle cx="25" cy="25" r="24" fill="#000000" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Shine overlay -->
  <ellipse cx="20" cy="15" rx="15" ry="20" fill="url(#shine)" opacity="0.4"/>
  
  <!-- Creative A logo -->
  <g transform="translate(25, 25)" filter="url(#glow)">
    <!-- Modern A with geometric twist -->
    <path d="M 0,-12 L 8,10 L 4,10 L 2,4 L -2,4 L -4,10 L -8,10 Z" fill="#ffffff"/>
    <!-- Creative triangle cutout - larger size -->
    <polygon points="0,-10 4,2 -4,2" fill="#000000"/>
  </g>
</svg>